name: imgy

# Relative paths here start from this folder: the build context and ../data are the repo root's.
services:
  imgy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: imgy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ../data:/data
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - IMGY_PASSWORD=${IMGY_PASSWORD:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
